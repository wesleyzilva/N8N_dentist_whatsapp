# Secretária WhatsApp: stack "local primeiro, pronta para a nuvem".
#
# Uso:  docker compose -f docker-compose.cloud-ready.yml up -d --build
#
# Regras deste arquivo (para o mesmo compose rodar no Docker Desktop e numa VM Linux):
#   * tudo que muda de ambiente vem do .env (nada de senha ou URL fixa aqui);
#   * os serviços se falam pelo NOME (postgres, intent-service). Sem host.docker.internal;
#   * os nomes dos volumes são os do compose atual (n8n-db, n8n-data). NÃO adicione
#     "name:" no topo: o projeto continua com o nome da pasta e os dados existentes
#     são reaproveitados. Nunca use `docker compose down -v` (apaga os volumes).

services:
  postgres:
    image: postgres:15 # mesma versão major do volume atual; não troque sem migrar os dados
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      # Só vale na criação do volume. Num volume que já existe, a senha continua a antiga
      # (hoje: n8n). Para trocar: ALTER USER n8n PASSWORD '...' e atualize o .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  intent-service:
    build:
      context: .
      dockerfile: Dockerfile.intent
    environment:
      PORT: 8001
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # Só na própria máquina, para você testar com curl. O n8n usa a rede interna.
      # Se rodar `python intent_service.py` no host, pare-o antes (mesma porta 8001).
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest} # fixe a versão no .env antes de ir para produção
    ports:
      # Local: só na sua máquina. Na nuvem, mantenha assim e coloque um proxy com HTTPS na frente.
      - "${BIND_ADDR:-127.0.0.1}:5678:5678"
    environment:
      # Banco interno do n8n
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${DB_POSTGRESDB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${DB_POSTGRESDB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Chave que criptografa as credenciais salvas no n8n. Precisa ser a MESMA do n8n atual
      # (veja docs/LOCAL_TO_CLOUD.md) e acompanhar o banco para qualquer ambiente novo.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # URL base pública, terminando em "/" e SEM "/webhook" (o n8n acrescenta sozinho).
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Atrás de proxy reverso (nuvem), use 1.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      intent-service:
        condition: service_started
    restart: unless-stopped

volumes:
  n8n-data:
  n8n-db:
