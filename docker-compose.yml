services:
  postgres:
    image: postgres:15
    container_name: postgres_n8n
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
      POSTGRES_DB: n8n
    volumes:
      - n8n-db:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_dra_daiana
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin123}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_DIAGNOSTICS_ENABLED=false
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-a8f10bc93e44472d9b626456a1b2c3d4}
      - GENERIC_TIMEZONE=${TZ:-America/Sao_Paulo}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      - postgres
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: evolution_dra_daiana
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      - CORS_ORIGIN=${EVOLUTION_CORS_ORIGIN:-http://localhost:5678}
      - CORS_METHODS=GET,POST,PUT,DELETE
    volumes:
      - evolution-instances:/evolution/instances
    restart: unless-stopped

volumes:
  n8n-data:
  n8n-db:
  evolution-instances: